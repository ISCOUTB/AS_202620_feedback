name: Revision semanal automatica

on:
  schedule:
    # Lunes 06:00 COT (11:00 UTC): pasada definitiva completa con deepseek-v4-pro.
    - cron: "0 11 * * 1"
    # Miercoles 06:00 COT: pasada temprana (delta) con deepseek-v4-flash.
    - cron: "0 11 * * 3"
    # Viernes 06:00 COT: pasada temprana (delta) con deepseek-v4-flash.
    - cron: "0 11 * * 5"
  push:
    branches:
      - master
    paths:
      - "scripts/cron/disparo.json"
  workflow_dispatch:
    inputs:
      semana:
        description: "Numero de semana a revisar (vacio = automatico)"
        required: false
        default: ""
      modo:
        description: "early | definitive | auto"
        required: false
        default: "auto"
      solo:
        description: "Repo unico para pruebas (vacio = todos)"
        required: false
        default: ""
      dry_run:
        description: "true = sin commit ni push"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: revision-semanal
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: America/Bogota
      LLM_BASE_URL: https://opencode.ai/zen/go/v1
      LLM_MODEL_DEFINITIVE: deepseek-v4-pro
      LLM_MODEL_EARLY: deepseek-v4-flash
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Elegir modo (schedule: lunes definitive, miercoles/viernes early)"
        if: github.event_name == 'schedule'
        run: |
          DOW=$(TZ=America/Bogota date +%u)
          if [ "$DOW" = "1" ]; then MODO=definitive; else MODO=early; fi
          echo "MODO=$MODO" >> "$GITHUB_ENV"

      - name: Evaluar semana
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODO_EFECTIVO="$MODO"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ ! -f scripts/cron/disparo.json ]; then
              echo "Push sin disparo.json: nada que evaluar."
              exit 0
            fi
            eval "$(python -c 'import json;d=json.load(open("scripts/cron/disparo.json",encoding="utf-8"));print("MODO_EFECTIVO=%s" % d.get("modo","auto"));print("SEMANA=%s" % d.get("semana",""));print("SOLO=%s" % d.get("solo",""));print("DRY=%s" % d.get("dry","false"))')"
          else
            MODO_EFECTIVO="${{ github.event.inputs.modo }}"
            SEMANA="${{ github.event.inputs.semana }}"
            SOLO="${{ github.event.inputs.solo }}"
            DRY="${{ github.event.inputs.dry_run }}"
          fi
          python scripts/cron/evaluar-semana.py \
            --semana "${SEMANA:-}" \
            --modo "${MODO_EFECTIVO:-auto}" \
            --solo "${SOLO:-}" \
            --dry-run "${DRY:-false}"
