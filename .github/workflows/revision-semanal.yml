name: Revision semanal automatica

on:
  schedule:
    # Lunes 06:00 COT (11:00 UTC): pasada definitiva completa con deepseek-v4.1-flash.
    - cron: "0 11 * * 1"
    # Miercoles 06:00 COT: pasada temprana (delta) con deepseek-v4.1-flash.
    - cron: "0 11 * * 3"
    # Viernes 06:00 COT: pasada temprana (delta) con deepseek-v4.1-flash.
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      semana:
        description: "Numero(s) de semana a revisar, separados por coma (ej. 1,2,3,4,5; vacio = automatico)"
        required: false
        default: ""
      modo:
        description: "early | definitive | auto"
        required: false
        default: "auto"
      solo:
        description: "Repo unico para pruebas (vacio = todos)"
        required: false
        default: ""
      lote:
        description: "Lote de cinco equipos (1-5; 0 = ejecutar todos los lotes)"
        required: false
        default: "0"
      dry_run:
        description: "true = sin commit ni push"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: revision-semanal
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Los lotes escriben sobre la misma rama. Se procesan en serie para que cada
      # uno parta del commit publicado por el anterior, sin carreras al hacer push.
      fail-fast: false
      max-parallel: 1
      matrix:
        lote: [1, 2, 3, 4, 5]
    env:
      TZ: America/Bogota
      LLM_BASE_URL: https://opencode.ai/zen/go/v1
      LLM_MODEL: deepseek-v4.1-flash
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # En ejecuciones manuales, el SHA del despacho puede quedar obsoleto mientras
          # espera el bloqueo de concurrencia. La publicación siempre parte de master.
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Elegir modo (schedule: lunes definitive, miercoles/viernes early)"
        if: github.event_name == 'schedule'
        run: |
          DOW=$(TZ=America/Bogota date +%u)
          if [ "$DOW" = "1" ]; then MODO=definitive; else MODO=early; fi
          echo "MODO=$MODO" >> "$GITHUB_ENV"

      - name: Evaluar semana
        run: |
          LOTE="${{ matrix.lote }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODO_EFECTIVO="$MODO"
            SEMANAS=""
            LOTE_SOLICITADO="0"
          else
            MODO_EFECTIVO="${{ github.event.inputs.modo }}"
            SEMANAS="${{ github.event.inputs.semana }}"
            SOLO="${{ github.event.inputs.solo }}"
            LOTE_SOLICITADO="${{ github.event.inputs.lote }}"
            DRY="${{ github.event.inputs.dry_run }}"
          fi
          # Un despacho con un lote concreto no duplica los otros cuatro. Una
          # prueba por repositorio se ejecuta solo una vez, en el primer lote.
          if [ "${LOTE_SOLICITADO:-0}" != "0" ] && [ "$LOTE_SOLICITADO" != "$LOTE" ]; then
            echo "Lote $LOTE omitido (se solicito $LOTE_SOLICITADO)."
            exit 0
          fi
          if [ -n "${SOLO:-}" ] && [ "${LOTE_SOLICITADO:-0}" = "0" ] && [ "$LOTE" != "1" ]; then
            echo "Lote $LOTE omitido: prueba de un unico repositorio."
            exit 0
          fi
          FALLO=0
          if [ -z "${SEMANAS:-}" ]; then
            ITEMS=("")
          else
            ITEMS=($(echo "$SEMANAS" | tr ',' ' '))
          fi
          for SEMANA in "${ITEMS[@]}"; do
            echo "::group::Semana ${SEMANA:-auto}"
            python scripts/cron/evaluar-semana.py \
              --semana "${SEMANA:-}" \
              --modo "${MODO_EFECTIVO:-auto}" \
              --solo "${SOLO:-}" \
              --lote "$LOTE" \
              --tamano-lote 5 \
              --dry-run "${DRY:-false}" || FALLO=1
            echo "::endgroup::"
          done
          exit $FALLO
